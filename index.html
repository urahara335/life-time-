<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lifetime — Ben&Ben</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scene" id="scene">
  <div class="title">Lifetime — Ben&amp;Ben</div>

  <div class="stars" id="stars"></div>

  <div class="roof">
    <svg viewBox="0 0 1000 280" preserveAspectRatio="none">
      <path d="M0,280 L0,50 Q500,-40 1000,50 L1000,280 Z" fill="#141a26"/>
      <path d="M0,50 Q500,-40 1000,50" stroke="#0a0e16" stroke-width="10" fill="none"/>
      <g stroke="#0d1219" stroke-width="3" opacity="0.7">
        <path d="M50,64 Q500,-14 950,64" fill="none"/>
        <path d="M50,90 Q500,16 950,90" fill="none"/>
        <path d="M50,116 Q500,46 950,116" fill="none"/>
      </g>
      <g stroke="#0a0e16" stroke-width="4" opacity="0.8">
        <line x1="100" y1="10" x2="100" y2="280"/>
        <line x1="280" y1="-18" x2="280" y2="280"/>
        <line x1="460" y1="-30" x2="460" y2="280"/>
        <line x1="640" y1="-30" x2="640" y2="280"/>
        <line x1="820" y1="-14" x2="820" y2="280"/>
      </g>
      <g fill="rgba(120,140,170,0.06)">
        <polygon points="60,60 190,20 190,280 60,280"/>
        <polygon points="290,15 450,-25 450,280 290,280"/>
        <polygon points="470,-27 630,-27 630,280 470,280"/>
        <polygon points="650,-25 810,15 810,280 650,280"/>
        <polygon points="830,20 940,58 940,280 830,280"/>
      </g>
    </svg>
  </div>

  <div class="wall-arches">
    <svg viewBox="0 0 1000 260" preserveAspectRatio="none">
      <path d="M40,260 L40,90 Q100,40 160,90 L160,260 Z" fill="none" stroke="#242a3a" stroke-width="3"/>
      <path d="M220,260 L220,90 Q280,40 340,90 L340,260 Z" fill="none" stroke="#242a3a" stroke-width="3"/>
      <path d="M400,260 L400,90 Q460,40 520,90 L520,260 Z" fill="none" stroke="#242a3a" stroke-width="3"/>
      <path d="M580,260 L580,90 Q640,40 700,90 L700,260 Z" fill="none" stroke="#242a3a" stroke-width="3"/>
      <path d="M760,260 L760,90 Q820,40 880,90 L880,260 Z" fill="none" stroke="#242a3a" stroke-width="3"/>
    </svg>
  </div>

  <div class="pillar p1"></div>
  <div class="pillar p2"></div>
  <div class="pillar p3"></div>
  <div class="pillar p4"></div>

  <div class="lamp l1"></div>
  <div class="lamp l2"></div>
  <div class="lamp l3"></div>
  <div class="lamp l4"></div>

  <div class="clock">
    <svg viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="30" fill="#12151d" stroke="#3a4050" stroke-width="2"/>
      <circle cx="32" cy="32" r="2.4" fill="#f2c879"/>
      <line class="clock-hand hand-hour" x1="32" y1="32" x2="32" y2="18" stroke="#dcd6c8" stroke-width="3" stroke-linecap="round"/>
      <line class="clock-hand hand-min" x1="32" y1="32" x2="32" y2="10" stroke="#dcd6c8" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="platform-floor"></div>
  <div class="platform-edge"></div>

  <div class="bench">
    <svg viewBox="0 0 110 34">
      <rect x="4" y="10" width="102" height="6" fill="#2a2f3d"/>
      <rect x="4" y="0" width="102" height="6" fill="#232734"/>
      <rect x="8" y="16" width="6" height="16" fill="#1a1d26"/>
      <rect x="96" y="16" width="6" height="16" fill="#1a1d26"/>
    </svg>
  </div>

  <div class="figure">
    <svg viewBox="0 0 26 56">
      <ellipse cx="13" cy="8" rx="7" ry="8" fill="#0c0e13"/>
      <path d="M4,18 Q13,12 22,18 L20,50 L6,50 Z" fill="#0c0e13"/>
    </svg>
  </div>

  <div class="rails">
    <div class="rail r1"></div>
    <div class="rail r2"></div>
  </div>

  <div class="dust" id="dust"></div>

  <div class="caption" id="captionZone">
    <div class="line" id="line1">line 1</div>
  </div>

  <div class="dots" id="dots"></div>
</div>

<script src="script.js"></script>

</body>
</html>
